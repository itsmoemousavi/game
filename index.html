<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d150f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Shrinefall</title>
  </head>
  <body>
    <div id="root">
    <section id="select">
      <h1>Shrinefall <small>prototype</small></h1>
      <p class="tag">3v3 · Destroy the enemy Shrine · Empty slots are filled by bots</p>
      <div id="hero-cards"></div>
      <div class="row">
        <span>Your lane</span>
        <div id="lane-pick"></div>
        <button id="btn-play">Play vs Bots</button>
      </div>
    </section>

    <div id="app" class="hidden">
      <canvas id="game"></canvas>

      <div id="topbar">
        <span class="team t0" id="score-0">0</span>
        <span id="clock">0:00</span>
        <span class="team t1" id="score-1">0</span>
      </div>

      <div id="herobar">
        <div id="portrait">B</div>
        <div class="bars">
          <div class="bar hp"><div id="hp-fill"></div><span id="hp-text"></span></div>
          <div class="bar mana"><div id="mana-fill"></div><span id="mana-text"></span></div>
          <div class="bar xp"><div id="xp-fill"></div></div>
        </div>
        <div class="stats">
          <div>Lv <b id="level">1</b></div>
          <div class="gold"><b id="gold">0</b></div>
          <div id="kda">0 / 0</div>
        </div>
      </div>

      <div id="joy-base"><div id="joy-knob"></div></div>

      <div id="actions">
        <button id="btn-q" class="ability" data-slot="0"><b>Q</b><span class="name"></span><span class="pips"></span><span class="cd"></span></button>
        <button id="btn-w" class="ability" data-slot="1"><b>W</b><span class="name"></span><span class="pips"></span><span class="cd"></span></button>
        <button id="btn-r" class="ability ult" data-slot="2"><b>R</b><span class="name"></span><span class="pips"></span><span class="cd"></span></button>
        <button class="learn" id="learn-q" data-learn="0">+</button>
        <button class="learn" id="learn-w" data-learn="1">+</button>
        <button class="learn" id="learn-r" data-learn="2">+</button>
        <button id="btn-attack">Attack</button>
      </div>
      <div id="cancel-zone">✕ Cancel</div>

      <div id="hint">Arrows / right-click: move · click enemy or Space: attack · Q W R: cast at cursor · Ctrl+Q/W/R or "+": learn · wheel: zoom</div>

      <div id="respawn" class="overlay"><div>Respawning in <b id="respawn-time">0</b></div></div>
      <div id="gameover" class="overlay">
        <div class="box">
          <h2 id="gameover-title">Victory</h2>
          <p class="sub"></p>
          <button id="btn-restart">Back to hero select</button>
        </div>
      </div>
    </div>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
