name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/dota-like-game-design-slf3o9
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One queue per branch, so a push to main never cancels a website update from the dev branch.
concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Only the dev branch publishes the website (GitHub Pages allows only that branch).
      # On main this workflow just checks that the tests pass and the game builds.
      - if: github.ref_name != 'main'
        uses: actions/configure-pages@v5
      - if: github.ref_name != 'main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
